<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Classroom Emotion Analytics</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap');

        :root {
            --bg: #0a0c10;
            --surface: #111318;
            --border: #1e2128;
            --accent: #00e5a0;
            --warn: #ff5f5f;
            --text: #e8eaf0;
            --muted: #6b7280;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 32px;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(10, 12, 16, 0.9);
        }

        .logo {
            font-family: 'Space Mono', monospace;
            font-size: 1rem;
            color: var(--accent);
        }

        .logo span {
            color: var(--muted);
        }

        .header-controls {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--muted);
        }

        .status-dot.active {
            background: var(--accent);
            box-shadow: 0 0 8px var(--accent);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1
            }

            50% {
                opacity: 0.4
            }
        }

        .btn {
            padding: 8px 20px;
            border-radius: 6px;
            border: none;
            font-family: 'Space Mono', monospace;
            font-size: 0.75rem;
            cursor: pointer;
        }

        .btn-start {
            background: var(--accent);
            color: #0a0c10;
        }

        .btn-stop {
            background: transparent;
            border: 1px solid var(--warn);
            color: var(--warn);
        }

        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .main {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 20px;
            padding: 24px 32px;
            max-width: 1600px;
            margin: 0 auto;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
        }

        .card-label {
            font-family: 'Space Mono', monospace;
            font-size: 0.65rem;
            color: var(--muted);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 14px;
        }

        .video-card {
            grid-row: 1/3;
        }

        .video-wrap {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
            aspect-ratio: 4/3;
        }

        .video-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-overlay {
            position: absolute;
            bottom: 12px;
            left: 12px;
            display: flex;
            gap: 8px;
        }

        .chip {
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid var(--border);
            padding: 4px 10px;
            border-radius: 99px;
            font-family: 'Space Mono', monospace;
            font-size: 0.65rem;
            color: var(--accent);
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            margin-top: 16px;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px;
            text-align: center;
        }

        .stat-value {
            font-family: 'Space Mono', monospace;
            font-size: 1.6rem;
            color: var(--accent);
        }

        .stat-label {
            font-size: 0.7rem;
            color: var(--muted);
            margin-top: 4px;
        }

        .engage-bar-wrap {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 340px;
            overflow-y: auto;
        }

        .student-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .student-name {
            width: 90px;
            font-size: 0.75rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex-shrink: 0;
        }

        .bar-track {
            flex: 1;
            height: 6px;
            background: var(--border);
            border-radius: 99px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            border-radius: 99px;
            background: var(--accent);
            transition: width 0.6s ease;
        }

        .emotion-badge {
            font-size: 0.65rem;
            padding: 2px 8px;
            border-radius: 99px;
            font-family: 'Space Mono', monospace;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: var(--accent);
        }

        .chart-wrap {
            height: 200px;
            position: relative;
        }

        @media(max-width:900px) {
            .main {
                grid-template-columns: 1fr
            }

            .video-card {
                grid-row: auto
            }

            .stats-row {
                grid-template-columns: repeat(2, 1fr)
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="logo">classroom<span>/</span>analytics</div>
        <div class="header-controls">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusText" style="font-size:0.75rem;color:var(--muted)">Idle</span>
            <button class="btn btn-start" id="btnStart" onclick="startSession()">▶ Start Session</button>
            <button class="btn btn-stop" id="btnStop" onclick="stopSession()" disabled>■ Stop</button>
        </div>
    </header>

    <div class="main">
        <div class="card video-card">
            <div class="card-label">Live Feed</div>
            <div class="video-wrap">
                <img id="videoFeed" src="/video_feed" alt="Live Feed" />
                <div class="video-overlay">
                    <div class="chip" id="sessionTimer">00:00</div>
                </div>
            </div>
            <div class="stats-row">
                <div class="stat-box">
                    <div class="stat-value" id="statStudents">0</div>
                    <div class="stat-label">Students</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="statEngage">—</div>
                    <div class="stat-label">Avg Engage</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="statDominant">—</div>
                    <div class="stat-label">Top Emotion</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="statFrames">0</div>
                    <div class="stat-label">Frames</div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-label">Student Engagement</div>
            <div class="engage-bar-wrap" id="engageList">
                <div style="color:var(--muted);font-size:0.8rem;text-align:center;padding:20px 0">Start a session to see
                    live data</div>
            </div>
        </div>

        <div class="card">
            <div class="card-label">Emotion Distribution</div>
            <div class="chart-wrap"><canvas id="emotionChart"></canvas></div>
        </div>
    </div>

    <script>
        const EMOTIONS = ['angry', 'disgust', 'fear', 'happy', 'sad', 'surprise', 'neutral'];
        const COLORS = { happy: '#00e5a0', surprise: '#fbbf24', neutral: '#9ca3af', sad: '#60a5fa', angry: '#f87171', fear: '#a78bfa', disgust: '#fb923c' };

        let sessionStart = null, pollInterval = null, timerInterval = null, totalFrames = 0;

        const chart = new Chart(document.getElementById('emotionChart').getContext('2d'), {
            type: 'doughnut',
            data: {
                labels: EMOTIONS,
                datasets: [{ data: new Array(7).fill(0), backgroundColor: EMOTIONS.map(e => COLORS[e]), borderWidth: 0 }]
            },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right', labels: { color: '#9ca3af', font: { size: 10 }, boxWidth: 10 } } } }
        });

        async function startSession() {
            await fetch('/api/session/start', { method: 'POST' });
            sessionStart = Date.now(); totalFrames = 0;
            document.getElementById('statusDot').classList.add('active');
            document.getElementById('statusText').textContent = 'Recording';
            document.getElementById('btnStart').disabled = true;
            document.getElementById('btnStop').disabled = false;
            pollInterval = setInterval(pollStats, 1500);
            timerInterval = setInterval(updateTimer, 1000);
        }

        async function stopSession() {
            const res = await fetch('/api/session/stop', { method: 'POST' });
            const data = await res.json();
            clearInterval(pollInterval); clearInterval(timerInterval);
            document.getElementById('statusDot').classList.remove('active');
            document.getElementById('statusText').textContent = 'Idle';
            document.getElementById('btnStart').disabled = false;
            document.getElementById('btnStop').disabled = true;
            if (data.summary) renderBars(Object.entries(data.summary).map(([n, d]) => [n, { avg_engagement: d.avg_engagement, current_emotion: d.dominant_emotion }]));
        }

        function updateTimer() {
            if (!sessionStart) return;
            const e = Math.floor((Date.now() - sessionStart) / 1000);
            document.getElementById('sessionTimer').textContent =
                `${String(Math.floor(e / 60)).padStart(2, '0')}:${String(e % 60).padStart(2, '0')}`;
        }

        async function pollStats() {
            try {
                const data = await (await fetch('/api/session/live')).json();
                if (!data.students) return;
                const students = Object.entries(data.students);
                totalFrames += students.length;
                document.getElementById('statStudents').textContent = students.length;
                document.getElementById('statFrames').textContent = totalFrames;
                if (!students.length) return;
                const avg = students.reduce((s, [, d]) => s + d.avg_engagement, 0) / students.length;
                document.getElementById('statEngage').textContent = (avg * 100).toFixed(0) + '%';
                const ec = {}; students.forEach(([, d]) => { ec[d.current_emotion] = (ec[d.current_emotion] || 0) + 1; });
                document.getElementById('statDominant').textContent = Object.entries(ec).sort((a, b) => b[1] - a[1])[0]?.[0] || '—';
                renderBars(students);
                chart.data.datasets[0].data = EMOTIONS.map(e => students.reduce((s, [, d]) => s + (d.emotion_counts[e] || 0), 0));
                chart.update('none');
            } catch (e) { }
        }

        function renderBars(students) {
            document.getElementById('engageList').innerHTML = students.map(([name, data]) => `
      <div class="student-row">
        <div class="student-name">${name}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${data.avg_engagement * 100}%;background:${data.avg_engagement > 0.6 ? 'var(--accent)' : data.avg_engagement > 0.3 ? '#fbbf24' : 'var(--warn)'}"></div></div>
        <div class="emotion-badge">${data.current_emotion}</div>
      </div>`).join('');
        }
    </script>
</body>

</html>
